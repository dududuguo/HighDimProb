name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  text-quality:
    name: Text quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject encoding artifacts
        run: python .github/scripts/check_text_quality.py

  build:
    name: Build and test
    runs-on: ubuntu-latest
    needs: text-quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: true
          use-mathlib-cache: true

      - name: Build library
        run: lake build

      - name: Build API judge
        run: lake build HighDimProbJudge

      - name: Test
        run: lake test
