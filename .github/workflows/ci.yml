name: CI

on:
  push:
    paths-ignore:
      - "**/*.md"
      - ".codebase-memory/**"
      - "docbuild/**"
      - "docs/**"
      - "external/**"
      - "tools/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - ".codebase-memory/**"
      - "docbuild/**"
      - "docs/**"
      - "external/**"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: true
          use-mathlib-cache: true

      - name: Build
        run: lake build

      - name: Test
        run: lake test
