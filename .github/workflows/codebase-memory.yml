name: Codebase Memory Graph

on:
  workflow_dispatch:
    inputs:
      commit_changes:
        description: Commit refreshed graph artifacts back to the current branch
        required: false
        type: boolean
        default: true
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: codebase-memory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh code knowledge graph
    runs-on: ubuntu-latest
    env:
      CBM_CACHE_DIR: ${{ runner.temp }}/codebase-memory-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          submodules: recursive

      - name: Install codebase-memory-mcp
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/DeusData/codebase-memory-mcp/main/install.sh \
            | bash -s -- --skip-config --dir="$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Rebuild graph
        run: |
          set -euo pipefail
          python .github/scripts/codebase_memory_update.py \
            --repo "$PWD" \
            --cache-dir "$CBM_CACHE_DIR" \
            --mode full

      - name: Install Graphviz
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Render Graphviz views
        run: |
          set -euo pipefail
          python .github/scripts/codebase_memory_graphviz.py --render

      - name: Show graph summary
        run: |
          set -euo pipefail
          python -c "import json; from pathlib import Path; metadata=json.loads(Path('external/codebase-memory/metadata.json').read_text()); stats=metadata['graph_stats']; print(f\"nodes={stats['total_nodes']} edges={stats['total_edges']}\"); print(f\"labels={stats['node_labels']}\"); print(f\"edge_types={stats['edge_types']}\")"

      - name: Upload generated graph
        uses: actions/upload-artifact@v4
        with:
          name: codebase-memory-graph
          path: |
            .codebase-memory/graph.db.zst
            external/codebase-memory/HighDimProb.db
            external/codebase-memory/metadata.json
            external/codebase-memory/graphviz/
          if-no-files-found: error

      - name: Commit refreshed graph
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.commit_changes)
        run: |
          set -euo pipefail
          if git diff --quiet -- .codebase-memory external/codebase-memory; then
            echo "Codebase-memory graph is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .codebase-memory external/codebase-memory
          git commit -m "Refresh codebase memory graph"
          git push origin HEAD:${GITHUB_REF_NAME}
