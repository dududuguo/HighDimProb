name: Codebase Memory Graphviz

on:
  workflow_dispatch:
    inputs:
      commit_changes:
        description: Commit rendered Graphviz artifacts back to the current branch
        required: false
        type: boolean
        default: true
  push:
    branches:
      - main
    paths:
      - ".github/scripts/codebase_memory_graphviz.py"
      - ".github/workflows/codebase-memory-graphviz.yml"
      - "external/codebase-memory/HighDimProb.db"

permissions:
  contents: write

concurrency:
  group: codebase-memory-graphviz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render Graphviz views
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install Graphviz
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Render views
        run: |
          set -euo pipefail
          python .github/scripts/codebase_memory_graphviz.py --render

      - name: Upload rendered views
        uses: actions/upload-artifact@v4
        with:
          name: codebase-memory-graphviz
          path: external/codebase-memory/graphviz/
          if-no-files-found: error

      - name: Commit rendered views
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.commit_changes)
        run: |
          set -euo pipefail
          if git diff --quiet -- external/codebase-memory/graphviz; then
            echo "Graphviz views are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add external/codebase-memory/graphviz
          git commit -m "Render codebase memory graphviz views"
          git push origin HEAD:${GITHUB_REF_NAME}
