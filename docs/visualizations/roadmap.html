  if (dependents[e.target]) dependents[e.target].push(e.source);
});

var graph;
var selectedNodeId = null;
var suppressNextCanvasClick = false;

function getNodeIdFromEvent(evt) {
  var candidates = [];
  function addCandidate(value) {
    if (typeof value === 'string' && value.length) candidates.push(value);
  }
  addCandidate(evt && evt.target && evt.target.id);
  addCandidate(evt && evt.target && evt.target.attributes && evt.target.attributes.id);
  addCandidate(evt && evt.id);
  if (evt && evt.item && typeof evt.item.getID === 'function') addCandidate(evt.item.getID());
  if (evt && evt.item && typeof evt.item.getModel === 'function') {
    var model = evt.item.getModel();
    addCandidate(model && model.id);
  }
  for (var i = 0; i < candidates.length; i++) {
    if (NODES.some(function(n) { return n.id === candidates[i]; })) return candidates[i];
  }
  var raw = candidates.join(' ');
  var byLength = NODES.slice().sort(function(a, b) { return b.id.length - a.id.length; });
  var matched = byLength.find(function(n) { return raw.indexOf(n.id) !== -1; });
  return matched ? matched.id : null;
}

function stopGraphEvent(evt) {
  if (evt && typeof evt.stopPropagation === 'function') evt.stopPropagation();
  if (evt && evt.originalEvent && typeof evt.originalEvent.stopPropagation === 'function') evt.originalEvent.stopPropagation();
  if (evt && evt.nativeEvent && typeof evt.nativeEvent.stopPropagation === 'function') evt.nativeEvent.stopPropagation();
}

function getClientPointFromEvent(evt) {
  var sources = [evt, evt && evt.originalEvent, evt && evt.nativeEvent];
  for (var i = 0; i < sources.length; i++) {
    var e = sources[i];
    if (!e) continue;
    if (typeof e.clientX === 'number' && typeof e.clientY === 'number') return [e.clientX, e.clientY];
    if (typeof e.x === 'number' && typeof e.y === 'number') return [e.x, e.y];
  }
  return null;
}

function getNodeIdAtClientPoint(evt) {
  if (!graph) return null;
  var client = getClientPointFromEvent(evt);
  if (!client) return null;
  var canvasPoint = null;
  if (typeof graph.getCanvasByClient === 'function') {
    canvasPoint = graph.getCanvasByClient(client);
  } else if (typeof graph.getCanvasByViewport === 'function') {
    var rect = document.getElementById('container').getBoundingClientRect();
    canvasPoint = graph.getCanvasByViewport([client[0] - rect.left, client[1] - rect.top]);
  }
  if (!canvasPoint) return null;
  var x = canvasPoint[0], y = canvasPoint[1];
  var best = null;
  var bestScore = Infinity;
  NODES.forEach(function(n) {
    var sx = n.style && n.style.x;
    var sy = n.style && n.style.y;
    if (typeof sx !== 'number' || typeof sy !== 'number') return;
    var dx = Math.abs(x - sx);
    var dy = Math.abs(y - sy);
    if (dx <= 90 && dy <= 32) {
      var score = dx * dx + dy * dy;
      if (score < bestScore) {
        bestScore = score;
        best = n.id;
      }
    }
  });
  return best;
}

function openNodeCard(nodeId) {
  if (!nodeId) return;
  showSidebar(nodeId);
  highlightRelated(nodeId);
}

function handleNativeCanvasClick(evt) {
  var id = getNodeIdAtClientPoint(evt);
  if (!id) return;
  suppressNextCanvasClick = true;
  openNodeCard(id);
  stopGraphEvent(evt);
}

function bindNativeCanvasClickFallback() {
  var container = document.getElementById('container');
  if (!container || container.dataset.nodeCardClickBound === '1') return;
  container.dataset.nodeCardClickBound = '1';
  container.addEventListener('click', handleNativeCanvasClick, true);
  var canvas = container.querySelector('canvas');
  if (canvas) canvas.addEventListener('click', handleNativeCanvasClick, true);
}

function initGraph() {
  graph = new G6.Graph({
    container: 'container',
    width: document.getElementById('container').clientWidth,
    height: document.getElementById('container').clientHeight,
    autoFit: 'view',
    animation: false,
    node: {
      type: 'rect',
      style: {
        size: [160, 40],
        radius: 6,
        lineWidth: 2,
        labelText: function(d) { return d.data.label; },
        labelFill: '#262626',
        labelFontSize: 12,
        labelFontWeight: '500',
        labelPlacement: 'center',
        cursor: 'pointer',
      },
      state: {
        selected: { lineWidth: 3, shadowColor: '#1890FF', shadowBlur: 12 },
        highlight: { lineWidth: 3, shadowColor: '#FAAD14', shadowBlur: 10 },
        dimmed: { opacity: 0.3 },
      },
    },
    edge: {
      type: 'polyline',
      style: {
        stroke: '#C0C0C0', lineWidth: 1.5,
        endArrow: true, endArrowSize: 8, radius: 4, offset: 12,
      },
      state: {
        highlight: { stroke: '#FAAD14', lineWidth: 2.5 },
        dimmed: { stroke: '#E8E8E8', opacity: 0.3 },
      },
    },
    behaviors: [
      'drag-canvas',
      { type: 'zoom-canvas', key: 'zoom-canvas', trigger: ['Control'], preventDefault: true, sensitivity: 1 },
      'drag-element',
    ],
    plugins: [{
      type: 'minimap',
      size: [160, 100],
      backgroundColor: '#fff',
    }],
    autoResize: true,
  });

  graph.setData({ nodes: NODES, edges: EDGES });
  var renderResult = graph.render();
  Promise.resolve(renderResult).then(function() {
    updateZoomLabel();
    bindNativeCanvasClickFallback();
  });

  graph.on('node:click', function(evt) {
    var id = getNodeIdFromEvent(evt);
    if (!id) return;
    suppressNextCanvasClick = true;
    stopGraphEvent(evt);
    openNodeCard(id);
  });

  graph.on('canvas:click', function(evt) {
    if (suppressNextCanvasClick || getNodeIdFromEvent(evt)) {
      suppressNextCanvasClick = false;
      return;
    }
    var id = getNodeIdAtClientPoint(evt);
    if (id) {
      openNodeCard(id);
      return;
    }
    closeSidebar();
    clearHighlight();
  });

  graph.on('node:mouseenter', function(evt) {
    var id = getNodeIdFromEvent(evt);
    if (!id) return;
    if (selectedNodeId !== id) highlightRelated(id);
  });

  graph.on('node:mouseleave', function() {
    if (selectedNodeId) { highlightRelated(selectedNodeId); }
    else { clearHighlight(); }
  });
}

function highlightRelated(nodeId) {
  selectedNodeId = nodeId;
  var related = {};
  related[nodeId] = true;
  EDGES.forEach(function(e) {
    if (e.source === nodeId) related[e.target] = true;
    if (e.target === nodeId) related[e.source] = true;
  });
  NODES.forEach(function(n) {
    if (related[n.id]) {
      graph.setElementState(n.id, n.id === nodeId ? ['selected'] : ['highlight']);
    } else {
      graph.setElementState(n.id, ['dimmed']);
    }
  });
  EDGES.forEach(function(e) {
    if (related[e.source] && related[e.target]) {
      graph.setElementState(e.id, ['highlight']);
    } else {
      graph.setElementState(e.id, ['dimmed']);
    }
  });
}

function clearHighlight() {
  selectedNodeId = null;
  NODES.forEach(function(n) { graph.setElementState(n.id, []); });
  EDGES.forEach(function(e) { graph.setElementState(e.id, []); });
}

function updateZoomLabel() {
  if (!graph) return;
  var el = document.getElementById('zoom-level');
  if (!el) return;
  var zoom = graph.getZoom ? graph.getZoom() : 1;
  el.textContent = Math.round(zoom * 100) + '%';
}

function zoomGraph(ratio) {
  if (!graph) return;
  var center = graph.getCanvasCenter ? graph.getCanvasCenter() : undefined;
  Promise.resolve(graph.zoomBy(ratio, { duration: 180, easing: 'ease' }, center))
    .then(updateZoomLabel);
}

function resetZoom() {
  if (!graph) return;
  Promise.resolve(graph.fitView({ when: 'always', direction: 'both' }, { duration: 240, easing: 'ease' }))
    .then(updateZoomLabel);
}

      '<span class="status-badge" style="background:' + sc.fill + '22;color:' + sc.stroke + ';border:1px solid ' + sc.stroke + '44">' +
        sc.badge + ' ' + sc.label +
      '</span></div></div>' +
    '<div class="info-group"><div class="info-label">标题</div><div class="info-value">' + d.title + '</div></div>' +
    '<div class="info-group"><div class="info-label">Lean 模块</div><div class="info-value"><code>' + d.lean_module + '</code></div></div>' +
    '<div class="info-group"><div class="info-label">层深 (Depth)</div><div class="info-value">' + d.depth + '</div></div>' +
    '<div class="info-group"><div class="info-label">依赖 (前置概念)</div><div class="dep-list">' + deps + '</div></div>' +
    '<div class="info-group"><div class="info-label">被依赖 (后续概念)</div><div class="dep-list">' + depsList + '</div></div>';
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebar-overlay').classList.add('show');
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('show');
}

function exportTodo() {
  var byDepth = {};
  NODES.forEach(function(n) {
    var d = n.data.depth;
    if (!byDepth[d]) byDepth[d] = [];
    byDepth[d].push(n);
  });
  var now = new Date().toISOString().slice(0, 10);
  var counts = { integrated: 0, in_progress: 0, blocked: 0, pending: 0 };
  NODES.forEach(function(n) { counts[n.data.status]++; });
  var md = '# Theory Roadmap — Leaf-Level Formalization Tasks\n';
  md += '> 生成于 ' + now + '\n';
  md += '> 共 ' + NODES.length + ' 个叶任务\n';
  md += '> ✅ ' + counts.integrated + ' 已完成 • 🔄 ' + counts.in_progress + ' 进行中 • 🚫 ' + counts.blocked + ' 阻塞 • ⏳ ' + counts.pending + ' 待开始\n\n';
  var depthKeys = Object.keys(byDepth).sort(function(a,b) { return Number(a)-Number(b); });
  depthKeys.forEach(function(d) {
    var label = DEPTH_NAMES[d] || 'Depth ' + d;
    md += '## Depth ' + d + ' (' + label + ')\n\n';
    byDepth[d].sort(function(a,b) { return a.data.index - b.data.index; });
    byDepth[d].forEach(function(n) {
      var sc = STATUS_COLORS[n.data.status] || STATUS_COLORS.pending;
      var depStr = n.data.deps.length ? ' (依赖: ' + n.data.deps.join(', ') + ')' : '';
      md += '- ' + sc.badge + ' **' + n.data.label + '** — ' + n.data.title + depStr + '\n';
      md += '  - 模块: `' + n.data.lean_module + '`\n';
    });
    md += '\n';
  });
  downloadFile('theory-roadmap-tasks.md', md);
  showToast('✅ Todo.md 已导出');
}

function exportSvg() {
  var canvas = document.querySelector('#container canvas');
  if (canvas) {
    var link = document.createElement('a');
    link.download = 'roadmap.png';
    link.href = canvas.toDataURL();
    link.click();
    showToast('✅ PNG 已导出');
  }
}

function downloadFile(filename, content) {
  var blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function showToast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function() { el.classList.remove('show'); }, 2500);
}

function renderStats() {
  var counts = { integrated: 0, in_progress: 0, blocked: 0, pending: 0 };
  NODES.forEach(function(n) { counts[n.data.status]++; });
  document.getElementById('stats-bar').innerHTML =
    '<div class="stat"><span class="stat-dot" style="background:#52C41A"></span>' + counts.integrated + ' 已完成</div>' +
    '<div class="stat"><span class="stat-dot" style="background:#1890FF"></span>' + counts.in_progress + ' 进行中</div>' +
    '<div class="stat"><span class="stat-dot" style="background:#FF4D4F"></span>' + counts.blocked + ' 阻塞</div>' +
    '<div class="stat"><span class="stat-dot" style="background:#BFBFBF"></span>' + counts.pending + ' 待开始</div>';
}

var DEPTH_NAMES = {
  "0": "仓库与导入面",
  "1": "标量概率对象",
  "2": "标量集中脊柱",
  "3": "几何/向量/极限定理",
  "4": "随机矩阵基础层",
  "5": "TraceExp / Tropp 提供者层",
  "6": "矩阵 Bernstein / 样本协方差消费者",
  "7": "当前硬骨头提供者缺口",
  "8": "后续定理族与稳定化"
};

window.addEventListener('resize', function() {
  if (graph) {
    graph.resize(
      document.getElementById('container').clientWidth,
      document.getElementById('container').clientHeight
    );
  }
});

window.addEventListener('load', function() {
  initGraph();
  renderStats();
});
</script>
</body>
</html>
